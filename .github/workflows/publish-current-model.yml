name: Publish Current Model as Champion

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-champion:
    runs-on: ubuntu-latest
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate bridge secrets
        shell: bash
        run: |
          test -n "$WORKER_BASE_URL" || (echo "WORKER_BASE_URL missing" && exit 1)
          test -n "$WORKER_CALLBACK_TOKEN" || (echo "WORKER_CALLBACK_TOKEN missing" && exit 1)

      - name: Validate current model
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          m=json.load(open('models/probability_model.json', encoding='utf-8'))
          model_id=str(m.get('model_id') or '')
          if not model_id:
              raise SystemExit('model_id missing')
          if int(m.get('schema_version') or 0) != 3:
              raise SystemExit('schema_version must be 3')
          if str((m.get('dmi_expert_contract') or {}).get('version') or '') != 'DMI-EXPERT-v3-ADX-1DP-STICKY':
              raise SystemExit('DMI Expert contract mismatch')
          print('Champion to publish:', model_id)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('MODEL_ID=' + model_id + '\n')
          PY

      - name: Publish directly as Champion / Active
        shell: bash
        run: |
          BASE="${WORKER_BASE_URL%/}"
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@models/probability_model.json" \
            "$BASE/api/internal/model/active"
          echo

      - name: Verify Active
        shell: bash
        run: |
          BASE="${WORKER_BASE_URL%/}"
          curl --fail --silent --show-error "$BASE/api/model/active" -o /tmp/active.json
          python - <<'PY'
          import json, os
          got=str(json.load(open('/tmp/active.json', encoding='utf-8')).get('model_id') or '')
          expected=os.environ['MODEL_ID']
          print('Expected:', expected)
          print('Active  :', got)
          if got != expected:
              raise SystemExit('Active Champion verification failed')
          PY
