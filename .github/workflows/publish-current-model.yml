name: Restore Champion Performance to R2

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore-performance:
    runs-on: ubuntu-latest
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Validate restored performance file
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/champion/performance.json', encoding='utf-8'))
          c=p.get('champion') or {}
          w=(p.get('windows') or {}).get('all') or {}

          expected = {
              'generation': 3,
              'model_id': 'e321f6d35445798b',
              'snapshots': 319,
              'settled_72h': 124,
              'pending_72h': 195,
          }
          actual = {
              'generation': int(c.get('generation') or 0),
              'model_id': str(c.get('model_id') or ''),
              'snapshots': int(w.get('snapshots') or 0),
              'settled_72h': int(w.get('settled_72h') or 0),
              'pending_72h': int(w.get('pending_72h') or 0),
          }
          print('Expected:', expected)
          print('Actual  :', actual)
          if actual != expected:
              raise SystemExit('STOP: local restored performance.json does not match the verified pre-error record')
          PY

      - name: Restore ONLY performance.json to R2
        shell: bash
        run: |
          test -n "$WORKER_BASE_URL" || (echo "WORKER_BASE_URL missing" && exit 1)
          test -n "$WORKER_CALLBACK_TOKEN" || (echo "WORKER_CALLBACK_TOKEN missing" && exit 1)
          BASE="${WORKER_BASE_URL%/}"

          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@data/champion/performance.json" \
            "$BASE/api/internal/champion/performance" \
            -o /tmp/performance-restore.json

          cat /tmp/performance-restore.json

      - name: Verify R2 performance restored
        shell: bash
        run: |
          BASE="${WORKER_BASE_URL%/}"
          curl --fail --silent --show-error \
            "$BASE/api/champion/performance" \
            -o /tmp/r2-performance.json

          python - <<'PY'
          import json
          p=json.load(open('/tmp/r2-performance.json', encoding='utf-8'))
          c=p.get('champion') or {}
          w=(p.get('windows') or {}).get('all') or {}
          actual = {
              'generation': int(c.get('generation') or 0),
              'model_id': str(c.get('model_id') or ''),
              'snapshots': int(w.get('snapshots') or 0),
              'settled_72h': int(w.get('settled_72h') or 0),
              'pending_72h': int(w.get('pending_72h') or 0),
          }
          expected = {
              'generation': 3,
              'model_id': 'e321f6d35445798b',
              'snapshots': 319,
              'settled_72h': 124,
              'pending_72h': 195,
          }
          print('R2 restored:', actual)
          if actual != expected:
              raise SystemExit('FATAL: R2 performance restore verification failed')
          PY
