name: Initialize Champion Challenger

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  initialize:
    runs-on: ubuntu-latest
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}
    steps:
      - name: Validate bridge secrets
        shell: bash
        run: |
          test -n "$WORKER_BASE_URL" || (echo "WORKER_BASE_URL missing" && exit 1)
          test -n "$WORKER_CALLBACK_TOKEN" || (echo "WORKER_CALLBACK_TOKEN missing" && exit 1)

      - name: Assign latest Candidate as current Challenger if none exists
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            "$WORKER_BASE_URL/api/internal/model/challenger/ensure"
          echo

      - name: Show current Champion and Challenger
        shell: bash
        run: |
          echo "Champion model id:"
          curl --fail --silent --show-error "$WORKER_BASE_URL/api/model/active" -o /tmp/active.json
          python - <<'PY'
          import json
          print(json.load(open('/tmp/active.json', encoding='utf-8')).get('model_id'))
          PY

          echo "Challenger manifest:"
          curl --fail --silent --show-error "$WORKER_BASE_URL/api/model/challenger/current"
          echo
