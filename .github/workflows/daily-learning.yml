name: Daily Champion 08:25 Daily-Confirmed Settlement & Evolution

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Cloudflare learning run id；手動執行可留空"
        required: false
        default: ""
        type: string
      checkpoint_date_tw:
        description: "手動補寫正式考卷日期 YYYY-MM-DD；留空 = 台灣今天"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: champion-settlement-evolution
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}
      LEARNING_RUN_ID: ${{ inputs.run_id }}
      REQUESTED_CHECKPOINT_DATE_TW: ${{ inputs.checkpoint_date_tw }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve learning run id
        shell: bash
        run: |
          if [ -z "$LEARNING_RUN_ID" ]; then
            echo "LEARNING_RUN_ID=manual_champion_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          fi

      - name: Validate Cloudflare bridge secrets
        shell: bash
        run: |
          test -n "$WORKER_BASE_URL" || (echo "WORKER_BASE_URL missing" && exit 1)
          test -n "$WORKER_CALLBACK_TOKEN" || (echo "WORKER_CALLBACK_TOKEN missing" && exit 1)

      - name: Report Champion review started
        shell: bash
        run: |
          BODY=$(python - <<'PY'
          import json, os
          print(json.dumps({
            "run_id": os.environ["LEARNING_RUN_ID"],
            "status": "RUNNING",
            "percent": 5,
            "message": "08:25 formal Champion checkpoint settlement started",
            "github_run_id": os.environ.get("GITHUB_RUN_ID"),
          }))
          PY
          )
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/learning/status"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Download current Champion from R2
        shell: bash
        run: |
          BASE="${WORKER_BASE_URL%/}"
          curl --fail --silent --show-error \
            "$BASE/api/model/active" \
            -o /tmp/active-model.json
          python - <<'PY'
          import json
          m=json.load(open('/tmp/active-model.json', encoding='utf-8'))
          print('Champion:', m.get('model_id'))
          if not m.get('model_id'):
              raise SystemExit('R2 Active model_id missing')
          PY

      - name: Download current Generation rolling ledger from R2
        shell: bash
        run: |
          BASE="${WORKER_BASE_URL%/}"
          GEN=$(python - <<'PY'
          import json
          d=json.load(open('data/champion/generation.json', encoding='utf-8'))
          print(int(d.get('generation') or 1))
          PY
          )
          echo "CHAMPION_GENERATION=$GEN" >> "$GITHUB_ENV"
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            "$BASE/api/internal/champion/ledger/export?generation=$GEN&days=3650" \
            -o /tmp/champion-ledger-export.json
          python - <<'PY'
          import json
          from pathlib import Path
          src=Path('/tmp/champion-ledger-export.json')
          out=Path('/tmp/champion-ledger.jsonl')
          payload=json.loads(src.read_text(encoding='utf-8')) if src.exists() else {}
          rows=payload.get('rows') or []
          legacy=Path('data/champion/ledger.jsonl')
          if not rows and legacy.exists() and legacy.stat().st_size:
              rows=[]
              for line in legacy.read_text(encoding='utf-8').splitlines():
                  line=line.strip()
                  if line:
                      rows.append(json.loads(line))
              print('R2 ledger empty: seeding migration from legacy GitHub ledger rows:', len(rows))
          out.write_text(''.join(json.dumps(r, ensure_ascii=False, separators=(',',':'))+'\n' for r in rows), encoding='utf-8')
          print('R2 rolling ledger rows:', len(rows))
          PY

      - name: Download formal 08:25 Champion checkpoints (target date + previous 3 days)
        shell: bash
        run: |
          BASE="${WORKER_BASE_URL%/}"
          TARGET_DATE_TW="${REQUESTED_CHECKPOINT_DATE_TW:-}"
          if [ -z "$TARGET_DATE_TW" ]; then
            TARGET_DATE_TW=$(TZ=Asia/Taipei date '+%Y-%m-%d')
          fi
          if ! [[ "$TARGET_DATE_TW" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "invalid checkpoint_date_tw: $TARGET_DATE_TW"
            exit 1
          fi
          # GNU date also validates impossible calendar dates.
          TZ=Asia/Taipei date -d "$TARGET_DATE_TW" '+%Y-%m-%d' >/dev/null
          echo "CHECKPOINT_DATE_TW=$TARGET_DATE_TW" >> "$GITHUB_ENV"
          echo "Target formal Champion exam date: $TARGET_DATE_TW"

          rm -rf /tmp/postclose-checkpoints
          mkdir -p /tmp/postclose-checkpoints
          rm -f /tmp/checkpoint-crypto.json /tmp/checkpoint-us-stock.json

          for OFFSET in 0 1 2 3; do
            DATE_TW=$(TZ=Asia/Taipei date -d "$TARGET_DATE_TW -$OFFSET day" '+%Y-%m-%d')
            for MARKET in crypto us-stock; do
              OUT="/tmp/postclose-checkpoints/${DATE_TW}_${MARKET}.json"
              if curl --fail --silent --show-error \
                "$BASE/api/champion/checkpoint?market=$MARKET&date=$DATE_TW" \
                -o "$OUT"; then
                echo "Downloaded formal 08:25 checkpoint: $DATE_TW / $MARKET"
                if [ "$OFFSET" = "0" ] && [ "$MARKET" = "crypto" ]; then cp "$OUT" /tmp/checkpoint-crypto.json; fi
                if [ "$OFFSET" = "0" ] && [ "$MARKET" = "us-stock" ]; then cp "$OUT" /tmp/checkpoint-us-stock.json; fi
              else
                rm -f "$OUT"
                echo "::warning::Formal 08:25 checkpoint missing: $DATE_TW / $MARKET"
              fi
            done
          done

      - name: Freeze 08:25 formal Champion checkpoint and regrade previous paths
        shell: bash
        run: |
          ARGS=(
            --active-model /tmp/active-model.json
            --symbols ALL
            --max-records 20000
          )
          if [ -s /tmp/checkpoint-crypto.json ]; then
            ARGS+=(--checkpoint-crypto /tmp/checkpoint-crypto.json)
          fi
          if [ -s /tmp/checkpoint-us-stock.json ]; then
            ARGS+=(--checkpoint-us-stock /tmp/checkpoint-us-stock.json)
          fi
          ARGS+=(
            --ledger-cache /tmp/champion-ledger.jsonl
            --ledger-cache-days 3650
            --r2-shard-dir /tmp/champion-ledger-shards
            --checkpoint-history-dir /tmp/postclose-checkpoints
          )
          python champion_daily.py "${ARGS[@]}"

      - name: Refresh Champion generation after active-model sync
        shell: bash
        run: |
          GEN=$(python - <<'PY'
          import json
          d=json.load(open('data/champion/generation.json', encoding='utf-8'))
          print(int(d.get('generation') or 1))
          PY
          )
          MODEL=$(python - <<'PY'
          import json
          d=json.load(open('data/champion/generation.json', encoding='utf-8'))
          print(str(d.get('champion_model_id') or ''))
          PY
          )
          test -n "$MODEL" || (echo "generation champion_model_id missing after champion_daily" && exit 1)
          echo "CHAMPION_GENERATION=$GEN" >> "$GITHUB_ENV"
          echo "Champion generation after sync: GEN$(printf '%03d' "$GEN") / $MODEL"

      - name: Upload Generation/date Frozen ledger shards and performance to R2
        shell: bash
        run: |
          BASE="${WORKER_BASE_URL%/}"
          python - <<'PY' > /tmp/shard-upload.tsv
          import json
          from pathlib import Path
          p=Path('/tmp/champion-ledger-shards/_upload_manifest.json')
          d=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'shards':[]}
          for s in d.get('shards') or []:
              print(f"{s['generation']}\t{s['date_tw']}\t{s['file']}")
          PY
          while IFS=$'\t' read -r GEN DATE FILE; do
            [ -n "$FILE" ] || continue
            curl --fail --silent --show-error \
              -X PUT \
              -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary "@$FILE" \
              "$BASE/api/internal/champion/ledger/shard?generation=$GEN&date=$DATE" \
              >/tmp/ledger-shard-upload.json
          done < /tmp/shard-upload.tsv

          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@data/champion/performance.json" \
            "$BASE/api/internal/champion/performance" \
            -o /tmp/performance-upload.json

          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@reports/evolution_review.json" \
            "$BASE/api/internal/champion/evolution?generation=$CHAMPION_GENERATION&kind=review" \
            -o /tmp/evolution-review-upload.json

          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@reports/evolution_policy.json" \
            "$BASE/api/internal/champion/evolution?generation=$CHAMPION_GENERATION&kind=policy" \
            -o /tmp/evolution-policy-upload.json

      - name: Read evolution gate
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          d=json.load(open('reports/evolution_review.json', encoding='utf-8'))
          due=bool(d.get('evolution_due'))
          print('settled_72h =', d.get('settled_72h'))
          print('minimum     =', d.get('minimum_settled_72h'))
          print('evolution   =', due)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('EVOLUTION_DUE=' + ('true' if due else 'false') + '\n')
          PY

      - name: Evolution review reached threshold - train next Champion
        if: ${{ env.EVOLUTION_DUE == 'true' }}
        run: |
          python run_training.py \
            --symbols ALL \
            --max-records 20000 \
            --step-bars 1 \
            --min-samples 50 \
            --frozen-reinforcement 10 \
            --ledger-cache /tmp/champion-ledger.jsonl \
            --evolution-policy reports/evolution_policy.json \
            --cache-only

      - name: Resolve next Champion model id
        if: ${{ env.EVOLUTION_DUE == 'true' }}
        shell: bash
        run: |
          NEXT_MODEL_ID=$(python - <<'PY'
          import json
          print(json.load(open('models/probability_model.json', encoding='utf-8')).get('model_id') or '')
          PY
          )
          test -n "$NEXT_MODEL_ID" || (echo "next Champion model_id missing" && exit 1)
          echo "NEXT_MODEL_ID=$NEXT_MODEL_ID" >> "$GITHUB_ENV"
          echo "Next Champion: $NEXT_MODEL_ID"

      - name: Commit frozen settlement / performance / optional evolved model
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/4h data/champion/generation.json data/champion/generations.json data/champion/performance.json reports/evolution_review.json reports/evolution_policy.json
          if git ls-files --error-unmatch data/champion/ledger.jsonl >/dev/null 2>&1; then
            git rm data/champion/ledger.jsonl
          fi
          if [ "$EVOLUTION_DUE" = "true" ]; then
            git add data/learning_meta.json models/probability_model.json reports/training_report.json quiz/model_timeline
          fi
          if git diff --cached --quiet; then
            echo "No Champion settlement changes."
            exit 0
          fi
          git commit -m "champion: freeze predictions, settle paths and update performance"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Publish evolved model directly as next Champion
        if: ${{ env.EVOLUTION_DUE == 'true' }}
        shell: bash
        run: |
          BASE="${WORKER_BASE_URL%/}"
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@models/probability_model.json" \
            "$BASE/api/internal/model/active" \
            -o /tmp/publish-active.json
          cat /tmp/publish-active.json
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@reports/training_report.json" \
            "$BASE/api/internal/learning/report?model_id=$NEXT_MODEL_ID" \
            -o /tmp/publish-report.json
          cat /tmp/publish-report.json
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@data/learning_meta.json" \
            "$BASE/api/internal/learning/meta?model_id=$NEXT_MODEL_ID" \
            -o /tmp/publish-meta.json
          cat /tmp/publish-meta.json

      - name: Verify next Champion after evolution
        if: ${{ env.EVOLUTION_DUE == 'true' }}
        shell: bash
        run: |
          BASE="${WORKER_BASE_URL%/}"
          curl --fail --silent --show-error "$BASE/api/model/active" -o /tmp/verify-active.json
          python - <<'PY'
          import json, os
          active=json.load(open('/tmp/verify-active.json', encoding='utf-8'))
          got=str(active.get('model_id') or '')
          expected=os.environ['NEXT_MODEL_ID']
          print('Expected:', expected)
          print('Active  :', got)
          if got != expected:
              raise SystemExit('Next Champion publish verification failed')
          PY

      - name: Roll over Generation immediately to published Champion
        if: ${{ env.EVOLUTION_DUE == 'true' }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          from training.champion_learning import (
              build_evolution_policy,
              build_evolution_review,
              build_performance,
              ensure_generation,
              load_json,
              load_ledger,
              save_json,
          )

          expected = str(os.environ.get('NEXT_MODEL_ID') or '').strip()
          if not expected:
              raise SystemExit('NEXT_MODEL_ID missing during Champion rollover')

          active = json.load(open('/tmp/verify-active.json', encoding='utf-8'))
          active_id = str(active.get('model_id') or '').strip()
          if active_id != expected:
              raise SystemExit(f'R2 Active changed before rollover: {active_id} != {expected}')

          generation_path = Path('data/champion/generation.json')
          generations_path = Path('data/champion/generations.json')
          performance_path = Path('data/champion/performance.json')
          review_path = Path('reports/evolution_review.json')
          policy_path = Path('reports/evolution_policy.json')
          ledger_path = Path('/tmp/champion-ledger.jsonl')

          manifest = load_json(generation_path, {
              'schema_version': 1,
              'generation': 1,
              'champion_model_id': '',
              'evolution_min_settled_72h': 120,
          })
          history = load_json(generations_path, [])
          old_generation = int(manifest.get('generation') or 1)
          old_model = str(manifest.get('champion_model_id') or '')
          now = datetime.now(timezone.utc)
          now_iso = now.isoformat()
          now_ms = int(now.timestamp() * 1000)

          manifest, history, changed = ensure_generation(
              manifest, history, expected, now_iso
          )
          if str(manifest.get('champion_model_id') or '') != expected:
              raise SystemExit('Generation rollover did not adopt the published Champion')
          if old_model != expected and not changed:
              raise SystemExit('Generation rollover expected a generation change but none occurred')

          ledger = load_ledger(ledger_path)
          performance = build_performance(ledger, manifest, history, now_ms=now_ms)
          review = build_evolution_review(ledger, manifest)
          policy = build_evolution_policy(review, ledger, manifest)

          save_json(generation_path, manifest)
          save_json(generations_path, history)
          save_json(performance_path, performance)
          save_json(review_path, review)
          save_json(policy_path, policy)

          new_generation = int(manifest.get('generation') or 1)
          current_all = (performance.get('windows') or {}).get('all') or {}
          print(f'Champion rollover: GEN{old_generation:03d} {old_model} -> GEN{new_generation:03d} {expected}')
          print('New generation snapshots :', current_all.get('snapshots'))
          print('New generation settled   :', current_all.get('settled_72h'))
          print('New generation pending   :', current_all.get('pending_72h'))

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f'CHAMPION_GENERATION={new_generation}\n')
          PY

      - name: Commit Champion generation rollover
        if: ${{ env.EVOLUTION_DUE == 'true' }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/champion/generation.json data/champion/generations.json data/champion/performance.json reports/evolution_review.json reports/evolution_policy.json
          if git diff --cached --quiet; then
            echo "Champion generation rollover produced no Git changes."
          else
            git commit -m "champion: roll over performance to published Champion"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Publish rolled-over Champion performance to R2
        if: ${{ env.EVOLUTION_DUE == 'true' }}
        shell: bash
        run: |
          BASE="${WORKER_BASE_URL%/}"

          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@data/champion/performance.json" \
            "$BASE/api/internal/champion/performance" \
            -o /tmp/performance-rollover-upload.json

          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@reports/evolution_review.json" \
            "$BASE/api/internal/champion/evolution?generation=$CHAMPION_GENERATION&kind=review" \
            -o /tmp/evolution-rollover-review-upload.json

          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@reports/evolution_policy.json" \
            "$BASE/api/internal/champion/evolution?generation=$CHAMPION_GENERATION&kind=policy" \
            -o /tmp/evolution-rollover-policy-upload.json

      - name: Verify Active Champion and performance ledger are synchronized
        shell: bash
        run: |
          BASE="${WORKER_BASE_URL%/}"
          curl --fail --silent --show-error "$BASE/api/model/active" -o /tmp/final-active.json
          curl --fail --silent --show-error "$BASE/api/champion/performance" -o /tmp/final-performance.json
          python - <<'PY'
          import json
          active=json.load(open('/tmp/final-active.json', encoding='utf-8'))
          perf=json.load(open('/tmp/final-performance.json', encoding='utf-8'))
          active_id=str(active.get('model_id') or '')
          champion=perf.get('champion') or {}
          perf_id=str(champion.get('model_id') or '')
          generation=int(champion.get('generation') or 0)
          print('R2 Active model      :', active_id)
          print('Performance Champion :', perf_id)
          print('Performance GEN      :', generation)
          if not active_id or not perf_id:
              raise SystemExit('Final Champion synchronization verification missing model_id')
          if active_id != perf_id:
              raise SystemExit(f'FINAL CHAMPION MISMATCH: Active={active_id} performance={perf_id}')
          PY

      - name: Daily summary
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open('data/champion/performance.json', encoding='utf-8'))
          r=json.load(open('reports/evolution_review.json', encoding='utf-8'))
          c=p.get('champion') or {}
          a=(p.get('windows') or {}).get('all') or {}
          print('Champion generation:', c.get('generation'))
          print('Champion model_id   :', c.get('model_id'))
          print('72H settled         :', a.get('settled_72h'))
          print('72H pending         :', a.get('pending_72h'))
          print('Success rate        :', a.get('success_rate'))
          print('Survival rate       :', a.get('structural_survival_rate'))
          print('True fail rate      :', a.get('true_fail_rate'))
          markets=p.get('by_market') or {}
          print('Crypto settled      :', ((markets.get('CRYPTO') or {}).get('all') or {}).get('settled_72h'))
          print('US-stock settled    :', ((markets.get('US_STOCK') or {}).get('all') or {}).get('settled_72h'))
          print('Evolution due       :', r.get('evolution_due'))
          PY
      - name: Report Champion review completed
        if: ${{ success() }}
        shell: bash
        run: |
          BODY=$(python - <<'PY'
          import json, os
          p=json.load(open('data/champion/performance.json', encoding='utf-8'))
          r=json.load(open('reports/evolution_review.json', encoding='utf-8'))
          c=p.get('champion') or {}
          a=(p.get('windows') or {}).get('all') or {}
          print(json.dumps({
            "run_id": os.environ["LEARNING_RUN_ID"],
            "status": "COMPLETED",
            "percent": 100,
            "model_id": c.get("model_id"),
            "settled_72h": a.get("settled_72h"),
            "pending_72h": a.get("pending_72h"),
            "success_rate": a.get("success_rate"),
            "true_fail_rate": a.get("true_fail_rate"),
            "evolution_due": r.get("evolution_due"),
            "message": "08:25 Terminal Champion checkpoints frozen; previous paths settled and performance updated.",
            "github_run_id": os.environ.get("GITHUB_RUN_ID"),
          }))
          PY
          )
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/learning/status"

      - name: Report Champion review failure
        if: ${{ failure() }}
        shell: bash
        run: |
          BODY=$(python - <<'PY'
          import json, os
          print(json.dumps({
            "run_id": os.environ.get("LEARNING_RUN_ID", "champion_review_failed"),
            "status": "FAILED",
            "percent": 0,
            "message": "08:25 Terminal Champion checkpoint settlement failed. Check GitHub Actions logs.",
            "github_run_id": os.environ.get("GITHUB_RUN_ID"),
          }))
          PY
          )
          curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/learning/status" || true

