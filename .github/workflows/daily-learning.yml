name: Daily S-state Learning v3 ADX 1DP Sticky

on:
  push:
    paths:
      - ".retrain/ADX-1DP-STICKY-v3"
  workflow_dispatch:
    inputs:
      run_id:
        description: "Cloudflare learning run id；手動執行可留空"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: crypto-state-learning
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      WORKER_BASE_URL: ${{ secrets.WORKER_BASE_URL }}
      WORKER_CALLBACK_TOKEN: ${{ secrets.WORKER_CALLBACK_TOKEN }}
      LEARNING_RUN_ID: ${{ inputs.run_id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve learning run id
        shell: bash
        run: |
          if [ -z "$LEARNING_RUN_ID" ]; then
            echo "LEARNING_RUN_ID=manual_learning_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          fi

      - name: Validate Cloudflare bridge secrets
        shell: bash
        run: |
          test -n "$WORKER_BASE_URL" || (echo "WORKER_BASE_URL missing" && exit 1)
          test -n "$WORKER_CALLBACK_TOKEN" || (echo "WORKER_CALLBACK_TOKEN missing" && exit 1)

      - name: Report learning started
        shell: bash
        run: |
          BODY=$(python - <<'PY'
          import json, os
          print(json.dumps({
            "run_id": os.environ["LEARNING_RUN_ID"],
            "status": "RUNNING",
            "percent": 5,
            "message": "HistoricalTraining Daily S-state Learning v3 ADX 1DP Sticky started",
            "github_run_id": os.environ.get("GITHUB_RUN_ID"),
          }))
          PY
          )
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/learning/status"

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Update history and retrain 4-way outcome JSON
        run: |
          python run_training.py \
            --symbols ALL \
            --max-records 20000 \
            --step-bars 1 \
            --min-samples 50

      - name: Resolve candidate model id
        shell: bash
        run: |
          MODEL_ID=$(python - <<'PY'
          import json
          print(json.load(open("models/probability_model.json", encoding="utf-8"))["model_id"])
          PY
          )
          test -n "$MODEL_ID" || (echo "candidate model_id missing" && exit 1)
          echo "MODEL_ID=$MODEL_ID" >> "$GITHUB_ENV"
          echo "Candidate model: $MODEL_ID"

      - name: Upload candidate model to R2
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@models/probability_model.json" \
            "$WORKER_BASE_URL/api/internal/model/candidate"

      - name: Upload candidate training report to R2
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@reports/training_report.json" \
            "$WORKER_BASE_URL/api/internal/learning/report?model_id=$MODEL_ID"

      - name: Upload learning meta to R2
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@data/learning_meta.json" \
            "$WORKER_BASE_URL/api/internal/learning/meta?model_id=$MODEL_ID"

      - name: Ensure a shadow Challenger exists
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            "$WORKER_BASE_URL/api/internal/model/challenger/ensure" \
            -o /tmp/challenger-ensure.json
          cat /tmp/challenger-ensure.json

      - name: Download Champion and current Challenger
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -o /tmp/active-model.json \
            "$WORKER_BASE_URL/api/model/active"
          curl --fail --silent --show-error \
            -o /tmp/challenger-manifest.json \
            "$WORKER_BASE_URL/api/model/challenger/current"
          curl --fail --silent --show-error \
            -o /tmp/challenger-model.json \
            "$WORKER_BASE_URL/api/model/challenger/model"

      - name: Evaluate Champion vs Challenger on future settled OOS cases
        shell: bash
        run: |
          python evaluate_challenger.py \
            --cases data/cases/history_cases.jsonl.gz \
            --active /tmp/active-model.json \
            --challenger /tmp/challenger-model.json \
            --manifest /tmp/challenger-manifest.json \
            --out reports/champion_challenger_evaluation.json

          EVAL_DECISION=$(python - <<'PY2'
          import json
          d=json.load(open("reports/champion_challenger_evaluation.json", encoding="utf-8"))
          print(d["decision"])
          PY2
          )
          EVAL_MODEL_ID=$(python - <<'PY2'
          import json
          d=json.load(open("reports/champion_challenger_evaluation.json", encoding="utf-8"))
          print(d["challenger_model_id"])
          PY2
          )
          echo "EVAL_DECISION=$EVAL_DECISION" >> "$GITHUB_ENV"
          echo "EVAL_MODEL_ID=$EVAL_MODEL_ID" >> "$GITHUB_ENV"

      - name: Store Champion vs Challenger evaluation in R2
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -X PUT \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary "@reports/champion_challenger_evaluation.json" \
            "$WORKER_BASE_URL/api/internal/model/evaluation?model_id=$EVAL_MODEL_ID"

      - name: Promote Challenger when all OOS gates pass
        if: ${{ env.EVAL_DECISION == 'PROMOTE' }}
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"model_id\":\"$EVAL_MODEL_ID\"}" \
            "$WORKER_BASE_URL/api/internal/model/promote"

      - name: Reject Challenger when OOS evidence is clearly worse or expires
        if: ${{ env.EVAL_DECISION == 'REJECT' }}
        shell: bash
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"model_id\":\"$EVAL_MODEL_ID\"}" \
            "$WORKER_BASE_URL/api/internal/model/reject"

      - name: Report candidate ready
        shell: bash
        run: |
          BODY=$(python - <<'PY'
          import json, os
          decision = os.environ.get("EVAL_DECISION", "NOT_EVALUATED")
          status = "CANDIDATE_READY"
          if decision == "PROMOTE":
              status = "MODEL_PROMOTED"
          elif decision == "REJECT":
              status = "CHALLENGER_REJECTED"
          print(json.dumps({
            "run_id": os.environ["LEARNING_RUN_ID"],
            "status": status,
            "percent": 100,
            "model_id": os.environ["MODEL_ID"],
            "challenger_model_id": os.environ.get("EVAL_MODEL_ID"),
            "evaluation_decision": decision,
            "message": "Daily model stored as candidate. Champion/Challenger decision uses future settled out-of-sample evidence; Active changes only after PROMOTE.",
            "github_run_id": os.environ.get("GITHUB_RUN_ID"),
          }))
          PY
          )
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/learning/status"

      - name: Upload audit cases
        uses: actions/upload-artifact@v4
        with:
          name: daily-cases-${{ github.run_number }}
          path: |
            data/cases/history_cases.jsonl.gz
            reports/champion_challenger_evaluation.json
          retention-days: 3
          if-no-files-found: warn

      - name: Commit new candles and candidate probability JSON
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cache/4h data/learning_meta.json models/probability_model.json reports/training_report.json quiz/model_timeline
          if git diff --cached --quiet; then
            echo "No new candle/model changes."
            exit 0
          fi
          git commit -m "learning: append market history and build candidate model"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Report learning failure
        if: ${{ failure() }}
        shell: bash
        run: |
          BODY=$(python - <<'PY'
          import json, os
          print(json.dumps({
            "run_id": os.environ.get("LEARNING_RUN_ID", "manual_learning_failed"),
            "status": "FAILED",
            "percent": 0,
            "model_id": os.environ.get("MODEL_ID"),
            "message": "Daily S-state Learning v3 ADX 1DP Sticky failed. Check GitHub Actions logs.",
            "github_run_id": os.environ.get("GITHUB_RUN_ID"),
          }))
          PY
          )
          curl --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $WORKER_CALLBACK_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$WORKER_BASE_URL/api/internal/learning/status" || true
